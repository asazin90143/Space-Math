<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Math</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer">
            <div id="score-board">Score: <span id="score">0</span></div>
            <div id="high-score-board">High Score: <span id="high-score">0</span></div>
            <div id="lives-board">Lives: <span id="lives">3</span></div>
            <div id="input-display">Input: <span id="current-input"></span><span class="cursor">|</span></div>
            <button id="pause-btn">II</button>
            <div id="level-up-msg">LEVEL UP!</div>
        </div>

        <div id="start-screen" class="screen active">
            <h1>SPACE MATH</h1>
            <p>Type the answer to destroy the asteroids!</p>

            <div class="difficulty-select">
                <label>Difficulty:</label>
                <select id="difficulty">
                    <option value="easy">Easy (Slow)</option>
                    <option value="medium">Medium (Normal)</option>
                    <option value="hard">Hard (Fast)</option>
                    <option value="expert">Expert (Extreme)</option>
                </select>
            </div>

            <div class="operations-select">
                <label><input type="checkbox" name="op" value="+" checked> Addition (+)</label>
                <label><input type="checkbox" name="op" value="-"> Subtraction (-)</label>
                <label><input type="checkbox" name="op" value="*"> Multiplication (*)</label>
                <label><input type="checkbox" name="op" value="/"> Division (÷)</label>
            </div>

            <button id="start-btn">START MISSION</button>
        </div>

        <div id="game-over-screen" class="screen">
            <h1>GAME OVER</h1>
            <p>Final Score: <span id="final-score">0</span></p>
            <button id="restart-btn">TRY AGAIN</button>
            <button id="game-over-menu-btn">MAIN MENU</button>
        </div>

        <div id="pause-screen" class="screen">
            <h1>PAUSED</h1>
            <button id="resume-btn">RESUME</button>
            <button id="menu-btn">MAIN MENU</button>
            <button id="mute-btn">MUTE SOUND</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
